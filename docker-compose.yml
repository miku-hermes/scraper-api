services:
  scraper-api:
    image: ghcr.io/miku-hermes/scraper-api:latest
    container_name: scraper-api
    restart: unless-stopped
    networks:
      1panel-network:
        ipv4_address: 172.18.0.10
    volumes:
      - ./cache:/app/scraper/cache
    environment:
      - NODE_ENV=production
      - PORT=3200
      # 镜像内置浏览器（camofox 9377 本机），不需要外部地址
      - CAMOFOX_URL=http://127.0.0.1:9377
    expose:
      - "3200"

networks:
  1panel-network:
    external: true
